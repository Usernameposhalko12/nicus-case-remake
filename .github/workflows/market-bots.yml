# Файл поклади в репозиторії за шляхом: .github/workflows/market-bots.yml
#
# Запускає server/market-bots-tick.js кожні 30 хв за розкладом GitHub Actions
# (безкоштовно для публічних репо; для приватних — в межах безкоштовного
# ліміту хвилин Actions). Боти купуватимуть предмети навіть якщо в грі
# ніхто не онлайн. Також можна запустити вручну кнопкою "Run workflow".
#
# ПОТРІБНО ЗРОБИТИ ОДИН РАЗ:
# 1. Firebase Console → Project settings → Service accounts →
#    Generate new private key → завантажиться JSON-файл.
# 2. GitHub репозиторій → Settings → Secrets and variables → Actions →
#    New repository secret:
#      Name:  FIREBASE_SERVICE_ACCOUNT_JSON
#      Value: (вміст того JSON-файлу, весь текст цілком)
# 3. Закоміть цей файл у .github/workflows/market-bots.yml, а
#    market-bots-tick.js + package.json — напр. у папку server/.
#
# ВАЖЛИВО: GitHub Actions cron не гарантує запуск ТОЧНО кожні 30 хв —
# при високому навантаженні на GitHub можливі затримки в кілька хвилин.
# Для гри це не критично.

name: Market Bots Tick

on:
  schedule:
    - cron: "*/30 * * * *"   # кожні 30 хвилин, UTC
  workflow_dispatch: {}       # можливість запустити вручну з вкладки Actions

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: server
        run: npm install

      - name: Run market bots tick
        working-directory: server
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node market-bots-tick.js
